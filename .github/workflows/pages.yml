# The project's site, at whatever address Pages is configured to serve.
#
# The page lives in `site/` and the pictures live in `screenshots/`, which is
# also where the README reads them from — one copy, so a screenshot refresh
# updates both rather than leaving the site showing a release-old panel. This
# workflow is what puts the two together.
#
# Enable it once in Settings → Pages → Source: **GitHub Actions**. Serving from
# a branch folder instead would mean keeping a duplicate of every screenshot
# under `site/`, which is exactly the drift this avoids.
name: Pages

on:
  push:
    branches: [main]
    # Only when something the page shows actually changed. A telemetry fix does
    # not need a deploy.
    paths:
      - 'site/**'
      - 'screenshots/**'
      - '.github/workflows/pages.yml'
  # So it can be published without waiting for a change.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time, and a newer push wins. Not `cancel-in-progress: false`
# — a queued deploy of an older commit is a site that goes backwards.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Assemble the site
        run: |
          mkdir -p _site
          cp -r site/. _site/
          # The page references these as `screenshots/…`, the same paths the
          # README uses, so nothing has to be rewritten in either.
          cp -r screenshots _site/screenshots
          # No CNAME here on purpose. proengineer.app is served from its own
          # host now, and a CNAME file would hand the domain back to Pages —
          # which would start redirecting this address to it again, and the
          # point of the split is that each address keeps its own.
          if [ -f CNAME ]; then cp CNAME _site/CNAME; fi
          # The sitemap's date comes from the commit being deployed. Written by
          # hand it would be a date that stops being true on the next edit, and
          # a sitemap that lies about freshness is worse than none.
          sed -i "s|LASTMOD|$(git log -1 --format=%cs)|" _site/sitemap.xml

      - name: Fail if the page references a picture that is not there
        # A broken image on a landing page is the kind of thing nobody notices
        # for a month. Cheap to check, and it catches a screenshot renamed on
        # one side only.
        run: |
          missing=0
          # Both the pictures the page embeds and the ones it only links to —
          # the overlay shots are links rather than images, and a dead link is
          # just as broken as a dead image.
          # Screenshots plus the icons and cards the head points at — a missing
          # favicon is a search result with a blank square next to it.
          refs=$(grep -oE '(src|href|content)="(/)?(screenshots/[^"]*|favicon\.ico|icon\.svg|icon-[0-9]+\.png|apple-touch-icon\.png|og\.png|site\.webmanifest)"' _site/index.html \
                 | cut -d'"' -f2 | sed 's|^/||; s|?.*||' | sort -u)
          for src in $refs; do
            if [ ! -f "_site/$src" ]; then
              echo "::error::index.html references $src, which does not exist"
              missing=1
            fi
          done
          exit $missing

      - name: Fail if the sitemap still has its placeholder
        run: |
          if grep -q LASTMOD _site/sitemap.xml; then
            echo "::error::sitemap.xml went out with LASTMOD unsubstituted"
            exit 1
          fi

      - name: Fail if the tab strip disagrees with the page
        # A strip whose order is not the page's order sends people somewhere
        # they did not expect and makes the highlight appear to jump backwards.
        run: |
          python3 - <<'CHECK'
          import re, sys
          s = open('_site/index.html', encoding='utf-8').read()
          nav = s[s.index('<nav class="tabs">'):s.index('</nav>')]
          tabs = re.findall(r'<a href="#([^"]+)"', nav)
          doc = [m.group(2) for m in
                 re.finditer(r'<(section|div class="term-body") id="([^"]+)"', s)]
          pos = {d: i for i, d in enumerate(doc)}
          missing = [t for t in tabs if t not in pos]
          order = [pos[t] for t in tabs if t in pos]
          bad = []
          if missing: bad.append(f'tabs point at nothing: {missing}')
          if order != sorted(order):
              bad.append(f'tab order {tabs} is not the order of the page {doc}')
          for b in bad: print(f'::error::{b}')
          sys.exit(1 if bad else 0)
          CHECK

      - name: Fail if the page advertises more features than it lists
        # The heading, the stat strip, the fold counts and the card badges all
        # claim a number. A landing page that overstates by six is worse than
        # one that says nothing, and nobody recounts by hand.
        run: |
          python3 - <<'CHECK'
          import re, sys
          s = open('_site/index.html', encoding='utf-8').read()
          feat = s[s.index('id="features"'):s.index('id="compare"')]
          rows = feat.count('<tr>')
          folds = sum(int(n) for n in re.findall(r'<span class="count">(\d+)</span>', feat))
          cards = sum(int(n) for n in re.findall(r'<span class="n">(\d+)</span>', s))
          bad = []
          if folds != rows: bad.append(f'fold counts sum to {folds}, but there are {rows} rows')
          if cards != rows: bad.append(f'card badges sum to {cards}, but there are {rows} rows')
          if f'<b>{rows}</b>' not in s: bad.append(f'the stat strip does not say {rows}')
          if f'{rows} features' not in s: bad.append(f'the meta description does not say {rows}')
          for b in bad: print(f'::error::{b}')
          sys.exit(1 if bad else 0)
          CHECK

      # No `enablement: true` here: creating a Pages site needs admin scope and
      # the workflow token does not have it — the attempt fails with "Resource
      # not accessible by integration". Pages is switched on once for the
      # repository (Settings → Pages → Source: GitHub Actions, or a POST to
      # /repos/:owner/:repo/pages with build_type=workflow), and this step then
      # only reads that configuration.
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
