[package]
name = "ac_tui"
description = "Professional telemetry TUI for Assetto Corsa"
default-run = "ac_pro_engineer"
repository = "https://github.com/Rgosh/ac-pro-engineer.git"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
ac_core = { path = "../core" }
# Timestamps CSV export filenames.
chrono = { workspace = true }
clap = { workspace = true, features = ["derive"] }
crossterm = { workspace = true }
ratatui = { workspace = true }
anyhow = { workspace = true }
serde_json = { workspace = true }
memmap2 = { workspace = true }
image = "0.24"
# Screenshots. `tui_tester` renders the TUI into a ratatui buffer, turns it into
# SVG (which is the exact, diffable record of what was drawn) and rasterises it
# here — so the PNGs in `screenshots/` are the real UI rather than a mock-up,
# and regenerating them needs nothing installed on the machine.
# `raster-images` is off: it pulls a JPEG decoder that does not build on this
# toolchain, and the screenshots contain no bitmaps — only text and rectangles.
resvg = { version = "0.48", default-features = false, features = [
    "text",
    "system-fonts",
] }
tokio = { workspace = true, features = [
    "rt-multi-thread",
    "rt",
    "macros",
    "process",
] }
tracing = { workspace = true, features = [
    "max_level_trace",
    "release_max_level_info",
] }
tracing-subscriber = { workspace = true, features = ["env-filter"] }

[target.'cfg(target_os="windows")'.dependencies]
windows = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_System_Console",
    "Win32_System_LibraryLoader",
    "Win32_UI_WindowsAndMessaging",
] }

[lib]
name = "ac_tui"
path = "src/lib.rs"

[[bin]]
name = "ac_pro_engineer"
path = "src/main.rs"

[[bin]]
name = "simulator"
path = "src/bin/simulator.rs"

[[bin]]
name = "tui_tester"
path = "src/bin/tui_tester.rs"
