[workspace]
resolver = "3"
members = ["core", "tui", "shm-bridge", "tests_suite"]

[workspace.package]
version = "0.3.4"
edition = "2024"
authors = ["Rgosh"]

[workspace.dependencies]
anyhow = "1.0"
zerocopy = "0.8.39"
chrono = "0.4"
clap = "4.5.60"
crossterm = "0.29.0"
directories-next = "2.0"
discord-rich-presence = "0.2"
memmap2 = "0.9.10"
nix = "0.31.1"
ratatui = "0.26"
serde = "1.0"
serde_json = "1.0"
reqwest = { version = "0.11", default-features = false, features = [
    "blocking",
    "json",
    "rustls-tls",
] }
rust-ini = "0.21"
tracing = "0.1"
tracing-subscriber = "0.3"
tracing-appender = "0.2"
windows = "0.52"
walkdir = "2.4"
tokio = "1.49.0"
# Unpacking release archives in the in-app updater. All pure Rust: gzip/deflate
# via flate2, so no C liblzma is linked in (see unix-archive in
# dist-workspace.toml).
tar = "0.4.46"
flate2 = "1.1.9"
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }

[workspace.lints.rust]
unused = { level = "warn", priority = -1 }
unsafe_code = "allow"
rust-2018-idioms = "warn"
rust-2021-compatibility = "warn"
rust-2024-compatibility = "warn"
nonstandard-style = "warn"
keyword-idents = "warn"
future-incompatible = "warn"
deprecated-safe = "warn"
let-underscore = { level = "warn", priority = -1 }
# `let _ = ...` is how this codebase deliberately discards a Result it has no
# useful reaction to — best-effort cleanup of temp files, mostly. Upstream has
# let_underscore_drop allow-by-default for exactly that reason; it is only on
# here because the whole let-underscore group is. Keep the group (it still
# catches `let _ = lock.lock()`, which drops a guard immediately) and turn off
# the one member that fires on the intended idiom.
let_underscore_drop = "allow"
unknown-or-malformed-diagnostic-attributes = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
correctness = { level = "warn", priority = -1 }
suspicious = { level = "warn", priority = -1 }
style = { level = "warn", priority = -1 }
complexity = { level = "warn", priority = -1 }
perf = { level = "warn", priority = -1 }
unwrap_used = "deny"
panic = "deny"

[profile.release]
lto = true
opt-level = 3
strip = "debuginfo"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
