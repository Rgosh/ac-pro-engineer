[workspace]
resolver = "3"
members = ["core", "kn5", "tui", "shm-bridge", "tests_suite"]

[workspace.package]
version = "0.4.1"
edition = "2024"
authors = ["Rgosh"]
# AGPL from the commit after 9ba92a3 (v0.3.6 and earlier were MIT, and stay
# MIT — that grant cannot be withdrawn; see LICENSE-MIT-HISTORICAL).
# `shm-bridge` is deliberately not on this: it is a fork of poljar/shm-bridge
# and keeps its own MIT licence.
license = "AGPL-3.0-only"

[workspace.dependencies]
# 1.0.103 is where RUSTSEC-2026-0190 was fixed — unsoundness in
# `Error::downcast_mut`. Same reasoning as memmap2 below: name the floor.
anyhow = "1.0.103"
zerocopy = "0.8.39"
chrono = "0.4"
clap = "4.5.60"
crossterm = "0.29.0"
directories-next = "2.0"
# **The patch version is spelled out on purpose.** 0.9.10 carries
# RUSTSEC-2026-0186, an unchecked pointer offset — in the crate that maps the
# game's shared memory, which is as close to this program's hot path as a
# dependency gets. A caret on "0.9" would let a fresh resolve pick it again.
memmap2 = "0.9.11"
nix = "0.31.1"
ratatui = "0.26"
serde = "1.0"
serde_json = "1.0"
# **0.12, and the reason is the advisory list rather than a feature.** 0.11
# pins hyper 0.14, which pins h2 0.3 (RUSTSEC-2026-0258) and rustls 0.21 with
# rustls-webpki 0.101 — three advisories there, two of them certificate
# name-constraint bugs. This crate is what downloads a release archive and a
# `shm-bridge.exe` and puts them on somebody's disk, so a flaw in how it decides
# a certificate is trustworthy is the one dependency bug that matters most here.
# 0.12 brings hyper 1, h2 0.4 and rustls-webpki 0.103, and clears all five.
#
# No system TLS anywhere: `rustls-tls` and nothing else, so a Linux build does
# not want OpenSSL headers and a Windows one does not want schannel behaving
# differently from the Linux build it was tested against.
reqwest = { version = "0.12", default-features = false, features = [
    "blocking",
    "json",
    "rustls-tls",
] }
rust-ini = "0.21"
tracing = "0.1"
tracing-subscriber = "0.3"
tracing-appender = "0.2"
windows = "0.52"
walkdir = "2.4"
tokio = "1.49.0"
# Unpacking release archives in the in-app updater. All pure Rust: gzip/deflate
# via flate2, so no C liblzma is linked in (see unix-archive in
# dist-workspace.toml).
tar = "0.4.46"
flate2 = "1.1.9"
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }

[workspace.lints.rust]
unused = { level = "warn", priority = -1 }
unsafe_code = "allow"
rust-2018-idioms = "warn"
rust-2021-compatibility = "warn"
rust-2024-compatibility = "warn"
nonstandard-style = "warn"
keyword-idents = "warn"
future-incompatible = "warn"
deprecated-safe = "warn"
let-underscore = { level = "warn", priority = -1 }
# `let _ = ...` is how this codebase deliberately discards a Result it has no
# useful reaction to — best-effort cleanup of temp files, mostly. Upstream has
# let_underscore_drop allow-by-default for exactly that reason; it is only on
# here because the whole let-underscore group is. Keep the group (it still
# catches `let _ = lock.lock()`, which drops a guard immediately) and turn off
# the one member that fires on the intended idiom.
let_underscore_drop = "allow"
unknown-or-malformed-diagnostic-attributes = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
correctness = { level = "warn", priority = -1 }
suspicious = { level = "warn", priority = -1 }
style = { level = "warn", priority = -1 }
complexity = { level = "warn", priority = -1 }
perf = { level = "warn", priority = -1 }
unwrap_used = "deny"
panic = "deny"

[profile.release]
lto = true
opt-level = 3
strip = "debuginfo"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
