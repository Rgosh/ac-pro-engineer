[ABOUT]
NAME = Pro Engineer
AUTHOR = Rgosh
; The release this app was shipped in, matching the workspace's Cargo version
; and PANEL_VERSION in ac_pro_engineer.lua. CSP shows it in the apps list, so
; it is the version a driver can read without opening anything — which makes it
; the first thing to get right, and it sat at 1.0 through eleven releases.
; `cargo test -p ac_core the_manifest_announces` keeps it honest.
VERSION = 0.4.1
DESCRIPTION = Live telemetry and race engineering advice, computed by the Pro Engineer desktop application.

[CORE]
; Loaded when a window is first opened and kept loaded after that.
;
; This said LAZY = FULL, which also unloads the script when the last window
; closes, on the grounds that it holds no state worth preserving. That was true
; of the telemetry — every number is re-read from shared memory each frame —
; and false of everything else. The settings, the console history and the
; measured layout all live in the script, and a driver who closes the panel to
; look at the track and opens it again gets a fresh copy of the file with the
; defaults back. Whatever reached ac.storage survives that; whatever did not is
; simply gone, and on a build where storage cannot be opened at all that is
; every setting, every time.
LAZY = ON

[WINDOW_...]
ID = main
NAME = Pro Engineer
ICON = icon.png
FUNCTION_MAIN = windowMain
; The gear icon in the window's title bar. Sections and units live there, not
; in the panel itself, which has no room to spare.
FUNCTION_SETTINGS = windowSettings
; Without SETTINGS in the flags, CSP knows about the function and shows no way
; to reach it: the chevron in the title bar only collapses the window. This is
; how CSP's own apps declare theirs.
FLAGS = SETTINGS
; MIN_SIZE, not SIZE_MIN. CSP's own apps spell it this way and an unknown key
; is ignored silently, which is how the window ended up unconstrained.
MIN_SIZE = 200, 120
SIZE = 300, 380

; A second window, and a second entry in CSP's sidebar. Advice is read while
; the telemetry is being watched, so it gets its own thing to move and size
; rather than a block that pushes the numbers down the panel.
[WINDOW_...]
ID = engineer
NAME = Pro Engineer — advice
ICON = icon.png
FUNCTION_MAIN = windowEngineer
MIN_SIZE = 160, 70
SIZE = 280, 150

; The lap debrief. A window rather than a block in the panel: it is read
; stopped, in the pits or rolling down the lane, and it wants to be somewhere
; the live panel is not. Taller than the advice window because it carries a
; header — which lap, how quick — above the lines.
[WINDOW_...]
ID = debrief
NAME = Pro Engineer — lap debrief
ICON = icon.png
FUNCTION_MAIN = windowDebrief
MIN_SIZE = 200, 120
SIZE = 320, 220

; A proper window for the settings, not just the gear: the gear's window is
; sized by CSP and ends up a narrow strip, and these are settings people read
; through once and change three of.
[WINDOW_...]
ID = settings
NAME = Pro Engineer — settings
ICON = icon.png
FUNCTION_MAIN = windowSettings
; Resizable, and roomy to start with: this window is read through, not glanced
; at. The gear in the panel's title bar opens CSP's own settings window, which
; CSP sizes itself — this is the one to drag.
MIN_SIZE = 300, 240
SIZE = 1040, 1180

; The whole frame, as it arrived. For the question the panel deliberately does
; not answer: is this number reaching the game at all.
[WINDOW_...]
ID = telemetry
NAME = Pro Engineer — telemetry
ICON = icon.png
FUNCTION_MAIN = windowTelemetry
MIN_SIZE = 220, 160
SIZE = 340, 520

; What to look at when the panel is empty.
[WINDOW_...]
ID = status
NAME = Pro Engineer — status
ICON = icon.png
FUNCTION_MAIN = windowStatus
MIN_SIZE = 220, 140
SIZE = 340, 300
