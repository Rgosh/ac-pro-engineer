[ABOUT]
NAME = AC Pro Engineer
AUTHOR = Rgosh
VERSION = 1.0
DESCRIPTION = Live telemetry and race engineering advice, computed by the AC Pro Engineer desktop application.

[CORE]
; FULL: load when the window is opened, unload when it is closed. The script
; holds no state worth preserving — everything it draws is re-read from shared
; memory each frame — so there is nothing to lose by unloading it.
LAZY = FULL

[WINDOW_...]
ID = main
NAME = AC Pro Engineer
ICON = icon.png
FUNCTION_MAIN = windowMain
; MIN_SIZE, not SIZE_MIN. CSP's own apps spell it this way and an unknown key
; is ignored silently, which is how the window ended up unconstrained.
MIN_SIZE = 200, 120
SIZE = 300, 380
