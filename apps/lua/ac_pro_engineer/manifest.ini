[ABOUT]
NAME = AC Pro Engineer
AUTHOR = Rgosh
VERSION = 1.0
DESCRIPTION = Live telemetry and race engineering advice, computed by the AC Pro Engineer desktop application.

[CORE]
; FULL: load when the window is opened, unload when it is closed. The script
; holds no state worth preserving — everything it draws is re-read from shared
; memory each frame — so there is nothing to lose by unloading it.
LAZY = FULL

[WINDOW_...]
ID = main
NAME = AC Pro Engineer
ICON = icon.png
FUNCTION_MAIN = windowMain
; The gear icon in the window's title bar. Sections and units live there, not
; in the panel itself, which has no room to spare.
FUNCTION_SETTINGS = windowSettings
; MIN_SIZE, not SIZE_MIN. CSP's own apps spell it this way and an unknown key
; is ignored silently, which is how the window ended up unconstrained.
MIN_SIZE = 200, 120
SIZE = 300, 380

; A second window, and a second entry in CSP's sidebar. Advice is read while
; the telemetry is being watched, so it gets its own thing to move and size
; rather than a block that pushes the numbers down the panel.
[WINDOW_...]
ID = engineer
NAME = AC Pro Engineer — advice
ICON = icon.png
FUNCTION_MAIN = windowEngineer
MIN_SIZE = 160, 70
SIZE = 280, 150
