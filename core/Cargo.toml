[package]
name = "ac_core"
description = "Core telemetry and setup logic for Pro Engineer"
# Must track the workspace: `updater::CURRENT_VERSION` is this crate's
# CARGO_PKG_VERSION, and it is what the app reports as its own version and
# compares release tags against.
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
# The car's real shape, out of the game's own model files. A workspace crate
# rather than a module here because it is a file-format parser and has nothing
# to do with telemetry — see `kn5/src/lib.rs`.
kn5 = { path = "../kn5" }

anyhow = { workspace = true }
zerocopy = { workspace = true, features = ["derive"] }
directories-next = { workspace = true }
walkdir = { workspace = true }
rust-ini = { workspace = true }
serde = { workspace = true, features = ["derive"] }
socket2 = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }
reqwest = { workspace = true, features = ["blocking", "json"] }
tracing = { workspace = true }
memmap2 = { workspace = true }
# Unconditional, unlike the tar/gzip pair below. It was Windows-only when the
# only zip this read was the updater's own release archive — but the bridge is
# published as `shm-bridge-x86_64-pc-windows-gnu.zip` and it is *Linux* that
# needs to unpack one, because Windows has no bridge at all.
zip = { workspace = true }

# Release-archive extraction for the in-app updater. dist ships .tar.gz for
# unix, so only the unix leg needs a tar reader.
[target.'cfg(not(target_os="windows"))'.dependencies]
tar = { workspace = true }
flate2 = { workspace = true }

[target.'cfg(target_os="windows")'.dependencies]
# Shared memory and the process check, and nothing else. The window, menu and
# GDI features were here for `native_window.rs`, the desktop overlay removed in
# v0.3.5 — the panel draws inside the game now, and this crate opens mappings.
windows = { workspace = true, features = [
    "Win32_System_Memory",
    "Win32_Foundation",
    "Win32_System_Threading",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_Security",
    # Finding the game. Steam records its own location in the registry, which
    # is the only source that is right for an install that is not in Program
    # Files; the drive bitmask goes with it, because probing A to Z by hand
    # blocks on a disconnected network letter until it times out.
    "Win32_System_Registry",
    "Win32_Storage_FileSystem",
] }

# Both archive readers are compiled under cfg(test) regardless of host, so the
# Windows .zip path is covered by the Linux CI leg too — otherwise it would be
# compiled only by the Windows leg and exercised by nothing. Writer support in
# `zip` is unconditional, so the round-trip tests need no extra features.
[dev-dependencies]
tar = { workspace = true }
flate2 = { workspace = true }
zip = { workspace = true }
# Only so `net` can prove that a blocking client builds inside a runtime. This
# crate has no async in it and must not grow any.
tokio = { workspace = true, features = ["rt-multi-thread"] }

# `cargo test` does not run an example's tests unless it is told to, and an
# example carrying a `mod tests` nobody runs is worse than one with none: it
# reads as coverage. What is tested here is the shape of the hex it prints —
# the whole point of the tool is that its output pastes into a layout test
# unedited.
[[example]]
name = "capture_pages"
test = true

# Same reason as capture_pages: an example carrying tests nobody runs reads as
# coverage. What is tested here is the statistic the whole report rests on —
# whether a word moved, and over what range.
[[example]]
name = "record_pages"
test = true
